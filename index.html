<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bobine">
<meta name="theme-color" content="#E5E3DA">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
html { --st: env(safe-area-inset-top, 0px); --sb: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<title>Bobine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=DM+Serif+Display&display=swap">
<style>
/* Concept : une app mobile plein écran, chaque écran est une feuille qui glisse ; sur ordinateur, l'app est présentée dans un cadre de téléphone. */
:root {
  --parcel: #E5E3DA;      /* fond */
  --surface: #F3F1EB;     /* cartes claires */
  --creme: #EAE4C8;       /* billets */
  --fig: #29100C;         /* navigation, texte */
  --oxblood: #5A1D22;     /* actions */
  --oxblood-2: #45161A;
  --chartreuse: #BFB065;  /* pièces */
  --capers: #53461C;
  --chambray: #A9C0CB;    /* Seine */
  --metro: #1F4D3A;       /* plaques */
  --rose: #D8B4B1;        /* mauvaise réponse */
  --texte-2: #6C5D57;
  --contour: #29100C;
  --desk: #2B1411;
  --f-titre: "DM Serif Display", "Times New Roman", Georgia, serif;
  --f-texte: "Barlow", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
html { box-sizing: border-box; }
body { touch-action: manipulation; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { background: var(--parcel); color: var(--fig); font: 400 16px/1.4 var(--f-texte); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 2px solid var(--chartreuse); outline-offset: 2px; }
a { color: inherit; text-decoration: none; }
img { display: block; }

#app { position: relative; width: 100%; height: 100%; margin: 0 auto; overflow: hidden; background: var(--parcel); isolation: isolate; }
#barre-etat, #ilot, #indic { display: none; }
/* Sur ordinateur seulement : l'app est montrée dans un iPhone 17 (écran 402 × 874), réduit pour tenir dans la fenêtre.
   Sur téléphone et tablette tactile, l'app occupe tout l'écran. */
@media (hover: hover) and (pointer: fine) and (min-width: 720px) {
  body { background: var(--desk); display: flex; align-items: center; justify-content: center; }
  #app { flex: none; width: 402px; height: 874px; margin: 0; border-radius: 56px; box-sizing: content-box; border: 12px solid #141010; outline: 2px solid #3a2a26; transform: scale(var(--s, 1)); }
  #app .screen { padding-top: 54px; }
  #app .screen.plein { padding-top: 0; }
  #app .haut-plein { padding-top: 58px !important; }
  #app #tabbar { padding-bottom: 30px; }
  #ilot { display: block; position: absolute; top: 11px; left: 50%; transform: translateX(-50%); width: 124px; height: 36px; border-radius: 20px; background: #000; z-index: 70; pointer-events: none; }
  #indic { display: block; position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 136px; height: 5px; border-radius: 3px; background: currentColor; opacity: .55; z-index: 70; pointer-events: none; color: var(--fig); }
  #barre-etat { display: flex; position: absolute; top: 0; left: 0; right: 0; height: 54px; padding: 18px 34px 0 44px; justify-content: space-between; font: 600 16px var(--f-texte); color: var(--fig); z-index: 65; pointer-events: none; }
  #app.clair #barre-etat, #app.clair #indic { color: var(--parcel); }
  #barre-etat svg { height: 13px; }
}
#grain { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: url(img/grain.png) repeat; background-size: 200px; opacity: .07; mix-blend-mode: multiply; pointer-events: none; z-index: 50; }

.screen { position: absolute; top: 0; right: 0; bottom: 0; left: 0; overflow-y: auto; overflow-x: hidden; overscroll-behavior: none; background: var(--parcel); scrollbar-width: none; display: flex; flex-direction: column; }
.screen::-webkit-scrollbar { display: none; }
.screen.dark { background: var(--fig); color: var(--parcel); }
.screen.rouge { background: var(--oxblood); color: var(--parcel); }
.screen[data-nav] { padding-bottom: calc(96px + var(--sb)); }
/* Aucun bloc ne se comprime : sur un écran plus court que la maquette, la page défile. */
.screen > * { flex-shrink: 0; }
/* Encoche et barre d'accueil quand Bobine est ouverte comme une app (écran d'accueil iPhone) */
.screen { padding-top: var(--st); }
.screen.plein { padding-top: 0; }
.haut-plein { padding-top: calc(14px + var(--st)) !important; }
.screen > .actions:last-child { padding-bottom: calc(32px + var(--sb)); }
.grow { flex: 1 0 auto; }
.pad { padding-inline: 20px; }

/* Typo */
.t-xl { font: 400 34px/1.1 var(--f-titre); text-wrap: balance; margin: 0; }
.t-l { font: 400 26px/1.15 var(--f-titre); margin: 0; }
.t-m { font: 400 21px/1.2 var(--f-titre); margin: 0; }
.t-s { font: 400 17px/1.25 var(--f-titre); margin: 0; }
.sur { font: 600 14px/1.2 var(--f-texte); color: var(--oxblood); margin: 0; }
.dark .sur, .rouge .sur { color: var(--chartreuse); }
.corps { font: 400 16px/1.45 var(--f-texte); margin: 0; }
.petit { font: 500 14px/1.35 var(--f-texte); margin: 0; }
.mini { font: 600 12px/1.3 var(--f-texte); margin: 0; }
.doux { color: var(--texte-2); }
.dark .doux, .rouge .doux { color: rgba(229,227,218,.72); }
.num { font-variant-numeric: tabular-nums; }

/* Barre du haut */
.topbar { display: flex; align-items: center; gap: 12px; padding: 12px 20px; min-height: 64px; }
.topbar .t-l, .topbar .t-s { flex: 1; min-width: 0; }
.rond { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--contour); display: grid; place-items: center; background: var(--surface); flex: none; }
.rond.sombre { background: rgba(41,16,12,.75); border-color: rgba(229,227,218,.5); color: var(--parcel); }
.rond svg { width: 18px; height: 18px; }
.compteur { display: inline-flex; align-items: center; gap: 8px; background: var(--fig); color: var(--parcel); border-radius: 999px; padding: 3px 11px 3px 3px; font: 700 15px var(--f-texte); flex: none; border: 1px solid var(--fig); }
.piece { width: 22px; height: 22px; border-radius: 50%; background: var(--chartreuse); border: 1.2px solid var(--fig); display: grid; place-items: center; flex: none; }
.piece::after { content: ""; width: 12px; height: 12px; border-radius: 50%; border: 1.4px solid var(--fig); }
.gain { background: var(--chartreuse); color: var(--fig); border-radius: 999px; padding: 4px 9px; font: 700 13px var(--f-texte); }

/* Boutons */
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 46px; border-radius: 14px; border: 1px solid var(--contour); font: 600 16px var(--f-texte); padding: 0 20px; transition: transform .12s, background .2s; }
.btn:active { transform: scale(.98); }
.btn svg { width: 18px; height: 18px; }
.b-prin { background: var(--oxblood); border-color: var(--oxblood); color: var(--parcel); }
.b-prin:active { background: var(--oxblood-2); }
.b-sec { background: var(--fig); border-color: var(--fig); color: var(--parcel); }
.b-clair { background: var(--parcel); color: var(--fig); border-color: var(--parcel); }
.b-fant { background: transparent; color: var(--parcel); border-color: var(--parcel); }
.b-contour { background: var(--surface); color: var(--fig); }
.b-recomp { background: var(--chartreuse); color: var(--fig); width: auto; margin-inline: auto; }
.actions { display: flex; flex-direction: column; gap: 12px; padding: 12px 20px 32px; }
.lien { font: 600 15px var(--f-texte); color: var(--oxblood); display: inline-flex; align-items: center; gap: 4px; }
.lien svg { width: 16px; height: 16px; }

/* Barre de navigation */
#tabbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 40; background: var(--fig); color: rgba(229,227,218,.65); display: flex; justify-content: space-between; align-items: flex-end; padding: 8px 12px calc(14px + var(--sb)); border-radius: 22px 22px 0 0; transition: transform .3s; }
#tabbar.cache { transform: translateY(160%); visibility: hidden; transition: transform .3s, visibility 0s .3s; }
.tab { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 12px var(--f-texte); padding-top: 8px; position: relative; }
.tab svg { width: 22px; height: 22px; }
.tab.actif { color: var(--parcel); }
.tab.actif::before { content: ""; position: absolute; top: 0; width: 22px; height: 3px; border-radius: 2px; background: var(--chartreuse); }
.tab-scan { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 600 12px var(--f-texte); color: var(--parcel); margin-top: -30px; }
.tab-scan span.bulle { width: 60px; height: 60px; border-radius: 50%; background: var(--capers); border: 3px solid var(--chartreuse); display: grid; place-items: center; color: var(--parcel); }
.tab-scan svg { width: 26px; height: 26px; }

/* Toast */
#toast { position: absolute; left: 20px; right: 20px; bottom: 110px; z-index: 60; background: var(--fig); color: var(--parcel); border-radius: 14px; padding: 12px 16px; font: 500 15px var(--f-texte); opacity: 0; transform: translateY(10px); transition: .25s; pointer-events: none; text-align: center; }
#toast.vu { opacity: 1; transform: none; }

/* Plaque d'arrondissement */
.plaque { display: inline-flex; align-items: center; background: var(--metro); color: var(--parcel); border-radius: 8px; padding: 4px; border: 1px solid var(--fig); }
.plaque > span { display: flex; align-items: center; gap: 10px; border: 1.5px solid rgba(229,227,218,.85); border-radius: 5px; padding: 3px 12px; }
.plaque b { font: 400 24px/1 var(--f-titre); }
.plaque i { width: 1.5px; align-self: stretch; background: rgba(229,227,218,.8); }
.plaque em { font: 500 14px var(--f-texte); font-style: normal; }
.plaque.grand b { font-size: 34px; } .plaque.grand em { font-size: 17px; } .plaque.grand > span { padding: 6px 16px; gap: 14px; }

.jauge { width: 100%; flex: none; align-self: stretch; height: 8px; border-radius: 999px; background: rgba(41,16,12,.12); overflow: hidden; }
.jauge > i { display: block; height: 100%; background: var(--oxblood); border-radius: 999px; }
.dark .jauge, .rouge .jauge, .w-prog .jauge { background: rgba(229,227,218,.18); }
.dark .jauge > i, .w-prog .jauge > i { background: var(--chartreuse); }

/* Billets */
.billet { display: flex; border: 1px solid var(--fig); border-radius: 14px; overflow: hidden; position: relative; background: var(--creme); color: var(--fig); --encoche: var(--fig); }
.billet .corps-b { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.billet .talon { width: 86px; flex: none; background: var(--chartreuse); border-left: 1.5px dashed rgba(41,16,12,.45); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; text-align: center; padding: 8px; }
.billet .talon.sombre { background: var(--fig); color: var(--parcel); border-left-color: rgba(229,227,218,.4); }
.billet .talon b { font: 400 28px/1 var(--f-titre); }
.billet .doux { color: var(--texte-2) !important; }
.billet .talon svg { width: 18px; height: 18px; }
.screen.fixe { overflow: hidden; }
.billet::before, .billet::after { content: ""; position: absolute; right: 75px; width: 22px; height: 22px; border-radius: 50%; background: var(--encoche); border: 1px solid var(--fig); }
.billet::before { top: -12px; } .billet::after { bottom: -12px; }
.billet.col::before, .billet.col::after { display: none; }

/* Pellicule */
.film { background: var(--fig); border-radius: 6px; padding: 8px; display: flex; gap: 8px; align-items: stretch; }
.perf { width: 8px; flex: none; background: repeating-linear-gradient(to bottom, var(--parcel) 0 8px, transparent 8px 15px); border-radius: 2px; opacity: .9; }
.film .cadre { flex: 1; border-radius: 3px; overflow: hidden; background: #000; }
.film .cadre img { width: 100%; height: 100%; object-fit: cover; }

/* Carte interactive */
.carte-vue { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background: #DCD8CC; touch-action: none; overflow: hidden; cursor: grab; -webkit-user-select: none; user-select: none; }
.carte-vue:active { cursor: grabbing; }
.carte-vue svg { position: absolute; top: 0; right: 0; bottom: 0; left: 0; width: 100%; height: 100%; overflow: visible; display: block; }
.m-arr { cursor: pointer; }
#m-etiq { transition: opacity .25s; }
.m-etiq { cursor: pointer; }
.m-etiq .lb, .m-pt .pt, .pin-in { transform-box: fill-box; transform-origin: center; }
.m-etiq .lb.bump { animation: bump .6s ease-out .1s; }
@keyframes bump { 40% { transform: scale(1.35); } }
.m-pt { cursor: pointer; }
.m-pt .pt { transition: transform .2s; }
.m-pt.sel .pt { transform: scale(0); }
.m-pt.attend { display: none; }
.m-pt .onde { opacity: 0; transform-box: fill-box; transform-origin: center; }
.m-pt.pop .pt { animation: pop .75s cubic-bezier(.2,1.7,.4,1) both; }
.m-pt.pop .onde { animation: onde 1.5s ease-out 3; }
.m-pt.pop .o2 { animation-delay: .5s; }
@keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
@keyframes onde { 0% { transform: scale(.7); opacity: .7; } 100% { transform: scale(4); opacity: 0; } }
.moi-halo { transform-box: fill-box; transform-origin: center; animation: moi 2.4s ease-out infinite; }
@keyframes moi { 0% { transform: scale(.8); opacity: .5; } 100% { transform: scale(2); opacity: 0; } }
.pin-in.tombe { animation: tombe .45s cubic-bezier(.2,1.5,.4,1); }
@keyframes tombe { 0% { transform: translateY(-18px) scale(.6); opacity: 0; } 100% { transform: none; opacity: 1; } }
.carte-haut { position: absolute; top: 0; left: 0; right: 0; z-index: 3; pointer-events: none; }
.carte-haut > div { pointer-events: auto; padding: 14px 20px 12px; }
.ch-paris { background: linear-gradient(var(--parcel) 72%, rgba(229,227,218,0)); padding-bottom: 26px !important; }
.ch-ligne { display: flex; align-items: center; gap: 10px; }
.ch-ligne h1 { flex: 1; }
.ch-focus { display: flex; gap: 10px; align-items: center; }
.carte-haut[data-mode="paris"] .ch-focus, .carte-haut:not([data-mode="paris"]) .ch-paris { display: none; }
.champ { flex: 1; display: flex; align-items: center; gap: 8px; height: 44px; border-radius: 999px; border: 1px solid var(--fig); background: var(--surface); padding: 0 14px; color: var(--texte-2); }
.champ svg { width: 18px; height: 18px; flex: none; }
.champ input { border: 0; background: none; flex: 1; min-width: 0; font: 500 16px var(--f-texte); color: var(--fig); outline: none; -webkit-appearance: none; appearance: none; }
.champ input::-webkit-search-cancel-button { display: none; }
.carte-resultats { position: absolute; left: 12px; right: 12px; top: calc(76px + var(--st)); z-index: 5; max-height: 52%; overflow-y: auto; overscroll-behavior: contain; background: var(--parcel); border: 1px solid var(--fig); border-radius: 18px; padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
.carte-outils { position: absolute; right: 16px; top: 140px; z-index: 3; display: flex; flex-direction: column; gap: 10px; transition: top .35s cubic-bezier(.2,.8,.2,1); }
.carte-outils .rond { width: 44px; height: 44px; }
.ordi-seul { display: none !important; }
@media (hover: hover) and (pointer: fine) { .ordi-seul { display: grid !important; font: 500 22px/1 var(--f-texte); } }
.carte-feuille { position: absolute; left: 0; right: 0; bottom: 60px; z-index: 4; background: var(--parcel); border-radius: 22px 22px 0 0; border-top: 1px solid var(--fig); padding: 8px 20px 40px; display: flex; flex-direction: column; gap: 12px; max-height: 58%; overflow-y: auto; overscroll-behavior: contain; transition: transform .38s cubic-bezier(.2,.8,.2,1); }
.carte-feuille.cache { transform: translateY(calc(100% + 140px)); pointer-events: none; }
.carte-feuille.replie { max-height: 92px; overflow: hidden; }
.carte-feuille > * { flex-shrink: 0; }
.carte-feuille .poignee { display: block; width: 44px; height: 5px; padding: 0; border: 0; position: relative; margin: 2px auto 2px; }
.carte-feuille .poignee::after { content: ""; position: absolute; top: -12px; right: -30px; bottom: -12px; left: -30px; }
.legende { display: flex; gap: 14px; flex-wrap: wrap; }
.legende span { display: inline-flex; gap: 6px; align-items: center; }
.legende i { width: 12px; height: 12px; border: 1px solid var(--fig); border-radius: 2px; }
.billet-fin { display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--fig); background: var(--chartreuse); }
.billet-fin svg { width: 22px; height: 22px; flex: none; }
.carte-bandeau { position: absolute; left: 50%; top: 120px; z-index: 6; transform: translate(-50%, -14px); opacity: 0; background: var(--fig); color: var(--parcel); border-radius: 999px; padding: 12px 22px 12px 16px; display: flex; gap: 12px; align-items: center; white-space: nowrap; transition: opacity .4s, transform .4s cubic-bezier(.2,1.4,.4,1); pointer-events: none; }
.carte-bandeau.vu { opacity: 1; transform: translate(-50%, 0); }
.volet { background: var(--parcel); border-radius: 22px 22px 0 0; border-top: 1px solid var(--fig); padding: 10px 20px 20px; display: flex; flex-direction: column; gap: 12px; position: relative; z-index: 2; transition: opacity .5s, transform .5s; }
.poignee { width: 44px; height: 5px; border-radius: 3px; background: rgba(41,16,12,.25); margin: 0 auto 4px; }
.ligne-lieu { display: flex; align-items: center; gap: 12px; padding: 4px 0; text-align: left; width: 100%; }
.ligne-lieu .ok { width: 30px; height: 30px; border-radius: 50%; background: var(--fig); color: var(--parcel); display: grid; place-items: center; flex: none; }
.ligne-lieu .ok svg { width: 14px; height: 14px; }
.ligne-lieu > div { flex: 1; min-width: 0; }
.ligne-lieu .chev { width: 16px; height: 16px; flex: none; }

/* Divers */
.carte-ui { background: var(--surface); border: 1px solid var(--fig); border-radius: 20px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--fig); font: 600 14px var(--f-texte); background: var(--surface); }
.chip.on { background: var(--fig); color: var(--parcel); }
.chip svg { width: 14px; height: 14px; }
.interr { width: 52px; height: 30px; border-radius: 999px; background: var(--fig); border: 1px solid var(--fig); position: relative; flex: none; transition: background .2s; }
.interr::after { content: ""; position: absolute; top: 3px; left: 25px; width: 22px; height: 22px; border-radius: 50%; background: var(--parcel); transition: left .2s; }
.interr[aria-checked="false"] { background: var(--creme); }
.interr[aria-checked="false"]::after { left: 3px; background: var(--surface); border: 1px solid var(--fig); top: 2px; }
.ligne-reg { display: flex; align-items: center; gap: 14px; padding: 14px 0; border-bottom: 1px solid rgba(41,16,12,.15); width: 100%; text-align: left; }
.ligne-reg > div { flex: 1; min-width: 0; }
.ico-rond { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--fig); display: grid; place-items: center; flex: none; background: var(--surface); }
.ico-rond svg { width: 18px; height: 18px; }

/* Scan */
.scan-fond { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background-size: cover; background-position: center; }
.scan-voile { position: absolute; top: 0; right: 0; bottom: auto; left: 0; height: 180px; background: linear-gradient(rgba(41,16,12,.75), transparent); }
.viseur { position: absolute; left: 19%; right: 19%; top: 34%; height: 30%; transition: .4s; }
.viseur i { position: absolute; width: 40px; height: 40px; border: 5px solid var(--parcel); transition: border-color .3s; }
.viseur i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; }
.viseur i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; }
.viseur i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; }
.viseur i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; }
.mode-viser .viseur { animation: respire 1.6s ease-in-out infinite; }
@keyframes respire { 50% { transform: scale(.96); } }
.mode-detecte .viseur i { border-color: var(--capers); }
.feuille .doux, .volet .doux { color: var(--texte-2) !important; }
.feuille .sur { color: var(--oxblood) !important; }
.mode-illisible .viseur i { border-color: var(--rose); }
.pastille { padding: 7px 14px; border-radius: 999px; background: var(--parcel); color: var(--fig); font: 600 14px var(--f-texte); border: 1px solid var(--fig); }
.mode-detecte .pastille { background: var(--capers); color: var(--parcel); border-color: var(--capers); }
.mode-illisible .pastille { background: var(--rose); }
.feuille { position: absolute; left: 0; right: 0; bottom: 0; background: var(--parcel); color: var(--fig); border-radius: 22px 22px 0 0; border-top: 1px solid var(--fig); padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 14px; transform: translateY(105%); transition: transform .45s cubic-bezier(.2,.8,.2,1); z-index: 3; }
.feuille.vu { transform: none; }

.reponse { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; min-height: 56px; border-radius: 14px; border: 1px solid var(--fig); background: var(--surface); padding: 0 18px; font: 600 20px var(--f-texte); text-align: left; transition: background .25s; }

.scene { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 18px 20px 8px; }

.affiche { width: 236px; aspect-ratio: 4 / 5; border-radius: 8px; overflow: hidden; border: 1px solid rgba(229,227,218,.4); position: relative; background: #000; }
.affiche img { width: 100%; height: 100%; object-fit: cover; }
.revele .affiche { animation: apparait .65s cubic-bezier(.2,.8,.2,1) .15s both; }
.revele .billet-r { animation: billet .5s ease-out .55s both; }
@keyframes apparait { from { opacity: 0; transform: scale(.82); } }

.billet-r { width: 280px; max-width: 100%; transform: rotate(-2.5deg); }

/* Caméra en faux paysage */
.paysage { position: absolute; top: 0; left: 0; transform-origin: 0 0; overflow: hidden; background: #000; color: var(--parcel); }

.grille { position: absolute; top: 0; right: 0; bottom: 0; left: 0; background:
  linear-gradient(to right, transparent calc(33.33% - .5px), rgba(229,227,218,.35) 0 calc(33.33% + .5px), transparent 0 calc(66.66% - .5px), rgba(229,227,218,.35) 0 calc(66.66% + .5px), transparent 0),
  linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(229,227,218,.35) 0 calc(33.33% + .5px), transparent 0 calc(66.66% - .5px), rgba(229,227,218,.35) 0 calc(66.66% + .5px), transparent 0); }
.cam-ui { position: absolute; top: 0; right: 0; bottom: 0; left: 0; display: flex; justify-content: space-between; padding: 20px 20px 20px 32px; }
.cam-ui .col { display: flex; flex-direction: column; justify-content: space-between; align-items: center; }
.declencheur { width: 76px; height: 76px; border-radius: 50%; border: 3px solid var(--parcel); display: grid; place-items: center; }

.tampon { position: absolute; background: var(--parcel); color: var(--oxblood); border: 1px solid var(--fig); border-radius: 8px; padding: 6px 14px; text-align: center; transform: rotate(8deg); }
.tampon b { font: 400 28px/1 var(--f-titre); display: block; }

/* Vidéothèque */
.etagere { display: flex; flex-direction: column; gap: 10px; text-align: left; width: 100%; }
.niche { background: #D8D5CA; border-radius: 6px 6px 0 0; padding: 10px 10px 0; }

.vhs { width: 30px; height: 150px; border-radius: 3px; background: var(--fig); position: relative; display: flex; flex-direction: column; align-items: center; padding: 5px 4px 4px; gap: 4px; box-shadow: inset 0 3px 0 rgba(255,255,255,.08), inset 0 -3px 0 rgba(255,255,255,.08); }

.pellicule { background: var(--fig); border-radius: 8px 8px 0 0; display: flex; flex-direction: column; }

/* Bobine souvenir (carte) */
.bob-carte { background: var(--fig); color: var(--parcel); border-radius: 10px; overflow: hidden; text-align: left; width: 100%; display: block; }

.lieu-ligne svg { width: 18px; height: 18px; flex: none; }

.badges { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; font: 600 12px var(--f-texte); }
.badge span { width: 58px; height: 58px; border-radius: 50%; display: grid; place-items: center; background: var(--chartreuse); border: 1px solid var(--fig); }

.defile { display: flex; gap: 12px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }

function qr() {
  let s = 7, out = '';
  const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const n = 25, finder = (x, y) => (x < 7 && y < 7) || (x > 17 && y < 7) || (x < 7 && y > 17);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    let on;
    if (finder(x, y)) { const fx = x > 17 ? x - 18 : x, fy = y > 17 ? y - 18 : y; on = fx === 0 || fx === 6 || fy === 0 || fy === 6 || (fx > 1 && fx < 5 && fy > 1 && fy < 5); }
    else on = r() > .52;
    if (on) out += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  return `<svg viewBox="-1 -1 27 27" width="150" height="150" fill="var(--fig)" role="img" aria-label="Code du bon d'achat">${out}</svg>`;
}

/* Animation : le lieu gagné apparaît sur la carte */

async function carteEntrer(param) {
